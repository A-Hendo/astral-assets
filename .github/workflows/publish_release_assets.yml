name: Publish Release Assets & Update Manifests

on:
  push:
    branches:
      - main
    paths:
      - "themes/**"
      - "sounds/**"
      - "models/**"
      - "dictionaries/**"
      - "scripts/**"

jobs:
  update-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Manifests
        run: |
          python3 scripts/generate_manifests.py

      - name: Commit & Push Updated Manifests
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update catalog manifests [skip ci]"
          file_pattern: "manifests/*.json"
