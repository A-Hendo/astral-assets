name: Validate Community Assets

on:
  pull_request:
    paths:
      - "themes/community/**"
      - "sounds/community/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Community Themes
        run: |
          python3 scripts/validate_theme.py themes/community

      - name: Validate Community Sounds
        run: |
          python3 scripts/validate_sound.py sounds/community
